<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f5f5">
  <title>Media Archive</title>
  <link rel="stylesheet" href="./css/style.css?v=20261123-favoriteslogout1">
  <script src="./js/config.js" defer></script>
  <script src="./js/api.js?v=20261123-favoriteslogout1" defer></script>
  <script src="./js/auth.js?v=20261123-favoriteslogout1" defer></script>
  <script src="./js/app.js?v=20261123-favoriteslogout1" defer></script>
</head>
<body>
  <div id="header">
    <button id="backButton" type="button">← 返回</button>
    <h1 id="pageTitle">人物</h1>
    <button id="favoritesPageButton" class="favorite-button is-favorite" type="button" aria-label="查看收藏" title="查看收藏">★</button>
  </div>

  <div id="signInModal" class="sign-in-modal" hidden>
    <div class="sign-in-dialog" role="dialog" aria-modal="true" aria-labelledby="signInTitle">
      <button id="closeSignInModal" class="close-modal-button" type="button" aria-label="關閉">×</button>
      <h2 id="signInTitle">登入以收藏</h2>
      <p>使用 Google 帳戶登入後，即可同步你的收藏內容。</p>
      <div id="googleSignInButton"></div>
    </div>
  </div>

  <div id="peopleList"></div>

  <div id="personDetail" style="display:none;">
    <div id="favoritesAccountArea" hidden>
      <span id="accountName"></span>
      <button id="signOutButton" type="button">登出</button>
    </div>
    <div id="personCategoryNav" class="category-nav"></div>
    <div id="personWorks"></div>
  </div>

  <div id="loading">
    <div class="spinner"></div>
    <div class="loading-text">載入中...</div>
  </div>

  <div id="errorMessage" role="alert"></div>
</body>
</html>
